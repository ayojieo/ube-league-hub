name: New season

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type yes only if the current season is still live and you want to replace it"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: hub-data
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build the new season from the Google Sheet
        env:
          UBE_CONFIRM: ${{ inputs.confirm }}
        run: python3 scripts/new_season.py

      - name: Save changes
        run: |
          git config user.name "ube-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data archive page.html
          git diff --cached --quiet || (git commit -m "New season" && (git push || (git pull --rebase && git push)))
