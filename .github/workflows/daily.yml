name: Daily update

on:
  schedule:
    - cron: "30 6 * * *" # 2:30 PM Asia/Manila
  workflow_dispatch:
    inputs:
      force:
        description: "Optional: type htb and/or schedule (comma separated) to refresh stats or schedules now"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: hub-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Update data
        id: update
        continue-on-error: true
        env:
          UBE_FORCE: ${{ inputs.force }}
        run: python3 scripts/update.py

      - name: Save changes
        run: |
          git config user.name "ube-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data archive
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily update $(date -u +%F)"
            git push || (git pull --rebase && git push)
          fi

      - name: Fail if the Google Sheet could not be read
        if: steps.update.outcome == 'failure'
        run: |
          echo "The Google Sheet could not be read. See the summary above."
          exit 1
