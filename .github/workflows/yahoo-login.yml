name: Yahoo login

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code from the localhost address (or paste the whole address)"
        required: true

permissions:
  contents: read

concurrency:
  group: hub-data
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: echo "NEW_REFRESH_TOKEN_FILE=$RUNNER_TEMP/yahoo_refresh" >> "$GITHUB_ENV"

      - name: Exchange the code
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_CODE: ${{ inputs.code }}
        run: python3 scripts/yahoo_login.py

      - name: Save the Yahoo key
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set YAHOO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$NEW_REFRESH_TOKEN_FILE"
          rm -f "$NEW_REFRESH_TOKEN_FILE"
          echo "saved"
